    <figure class="media-card">
      <img src="assets/images/etalase-kopi.jpg" alt="Etalase Kopi Tan dengan cangkir latte dan dekorasi bunga kering" />
      <figcaption>Meja etalase membantu pelanggan mengenali pilihan kopi.</figcaption>
    </figure>
    <figure class="media-card">
      <img src="assets/images/mesin-kopi.jpg" alt="Mesin espresso Kopi Tan yang digunakan untuk menyeduh setiap pesanan" />
      <figcaption>Mesin espresso menjaga konsistensi rasa di setiap cangkir.</figcaption>
    </figure>
    <figure class="media-card">
      <img src="assets/images/biji-kopi.jpg" alt="Biji kopi pilihan tumpah dari toples kaca" />
      <figcaption>Biji kopi pilihan disortir sebelum digiling setiap pagi.</figcaption>
    </figure>
    <figure class="media-card">
      <img src="assets/images/biji-kopi2.jpg" alt="Penggiling kopi manual bersama jam antik di sudut kedai" />
      <figcaption>Penggiling manual jadi bagian dari cerita seduh Kopi Tan.</figcaption>
    </figure>
    <figure class="media-card">
      <img src="assets/images/kkopi.jpg" alt="Bubuk kopi dan latte art berbentuk hati dilihat dari atas" />
      <figcaption>Detail bubuk kopi dan latte art favorit pelanggan.</figcaption>
    </figure>
    <figure class="media-card">
      <img src="assets/images/suasana-1.jpg" alt="Meja dan kursi outdoor Kopi Tan dengan hiasan bunga" />
      <figcaption>Area outdoor yang nyaman untuk nongkrong santai.</figcaption>
    </figure>
    <figure class="media-card">
      <img src="assets/images/suasana-2.jpg" alt="Sudut baca dekat jendela dengan rak buku kecil" />
      <figcaption>Sudut baca dengan pencahayaan alami di dekat jendela.</figcaption>
    </figure>
    <figure class="media-card">
      <img src="assets/images/rak-buku.jpg" alt="Rak dinding berisi buku, tanaman, dan jam kecil" />
      <figcaption>Rak baca kecil untuk pelanggan yang ingin bersantai sambil ngopi.</figcaption>
    </figure>
